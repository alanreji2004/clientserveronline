services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ide-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - EXECUTION_MODE=local
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ide-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  runner-sandbox:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: ide-runner-sandbox
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

